name: "Correction or addition"
description: "Something in these notes is wrong, unclear or missing"
title: ""
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post**

        - Describe only what you observed on your own device, in your own words.
        - Do not post SDK files or headers, firmware, disassembly, decompiled code, keys or links to them.
  - type: input
    id: where
    attributes:
      label: "Which document and section?"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What is wrong or missing?"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "How do you know?"
      description: "What you ran and what you observed on your own device"
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: "PS5 system software version"
    validations:
      required: false
  - type: dropdown
    id: enabler
    attributes:
      label: "Homebrew enabler"
      options:
        - "etaHEN"
        - "kstuff-lite"
        - "onionHEN"
        - "Other (name it below)"
        - "Not sure"
    validations:
      required: false
  - type: input
    id: enabler_version
    attributes:
      label: "Homebrew enabler version"
      description: "For example etaHEN 2.5b. Name it here if you chose Other."
    validations:
      required: false
  - type: input
    id: shadowmount
    attributes:
      label: "ShadowMountPlus version"
      description: "Leave empty if you do not use it"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Checks"
      options:
        - label: "This contains only my own observations and words."
          required: true
